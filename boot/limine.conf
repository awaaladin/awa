# Limine configuration for AWA.
timeout: 0
verbose: yes

/AWA
    protocol: limine
    path: boot():/boot/awa-kernel
    module_path: boot():/boot/init
    module_path: boot():/boot/ping
    module_path: boot():/boot/pong
    module_path: boot():/boot/crashme
    module_path: boot():/boot/noperm
    module_path: boot():/boot/fuzz
