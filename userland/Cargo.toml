# AWA user programs. Built separately from the kernel (position-independent,
# normal code model) by `python tools/awa.py build`.
[workspace]
resolver = "3"
members = ["init", "ping", "pong", "crashme", "noperm", "fuzz"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
